[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tronpy"
dynamic = ["version"]
requires-python = ">=3.11"
description = "TRON Python client library"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "andelf", email = "andelf@gmail.com" },
    { name = "MrNaif2018", email = "chuff184@gmail.com" },
]
readme = "README.md"
keywords = ["tron", "api", "blockchain"]
classifiers = [
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "base58",
    "cryptography>=50.0.2",
    "eth-abi>=5.0.0,<7.0.0",
    "eth-utils",
    "httpx2>=2.15.1",
    "pycryptodome<5",
    "universalasync>=0.6.3.1",
]

[project.optional-dependencies]
mnemonic = ["mnemonic==0.21"]
offline = ["protobuf"]

[project.urls]
Homepage = "https://github.com/bitcart/tronpy"
Source = "https://github.com/bitcart/tronpy"
Changelog = "https://github.com/bitcart/tronpy/blob/master/CHANGELOG.md"
Documentation = "https://tronpy.bitcart.ai"

[dependency-groups]
lint = ["deptry", "mypy", "prek", "ruff"]
test = [
    "freezegun",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-durations",
    "pytest-rerunfailures",
]
docs = ["zensical", "mkdocstrings-python"]
dev = ["rust-just>=1.46.0", { include-group = "lint" }, { include-group = "test" }]
all = [{ include-group = "dev" }, { include-group = "docs" }]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "tronpy/version.py" }]
# dependency cooldowns for security
exclude-newer = "1 week"

# except for our packages
[tool.uv.exclude-newer-package]
universalasync = "0 days"

[tool.hatch.build.targets.sdist]
include = ["tronpy", "tests", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["tronpy"]

[tool.hatch.version]
path = "tronpy/version.py"

[tool.ruff]
target-version = "py311"
line-length = 127
extend-exclude = ["tronpy/proto/tron_pb2.*"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "I",
    "UP",
    "YTT",
    "B",
    "T10",
    "C",
    "SIM",
    "RUF100",
    "RET",
    "A",
    "S",
    "ASYNC",
    "TID",
    "PLC",
]
ignore = ["RET502", "RET503", "S104", "S507", "ASYNC109", "ASYNC110"]
mccabe = { max-complexity = 12 }

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
untyped_calls_exclude = ["eth_abi"]
exclude = ["tests"]

[tool.pytest.ini_options]
strict = true
testpaths = ["tests"]
junit_duration_report = "call"
junit_suite_name = "tronpy_test_suite"
addopts = [
    "--cov=tronpy",
    "--cov-report",
    "term-missing",
    "--reruns",
    "5",
    "--reruns-delay",
    "3",
    "--only-rerun",
    "503 Server Error|503 Service Unavailable",
]
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["tronpy/version.py", "tronpy/proto/tron_pb2.py"]
